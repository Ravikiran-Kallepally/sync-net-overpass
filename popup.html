<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; background: #121212; color: #e0e0e0; margin: 0; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    #status { font-size: 11px; color: #4caf50; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
    textarea { width: 100%; height: 180px; background: #1e1e1e; color: #00ffc2; border: 1px solid #333; border-radius: 8px; padding: 10px; font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; resize: none; box-sizing: border-box; }
    .btn-container { margin-top: 15px; display: flex; flex-direction: column; gap: 8px; }
    .btn { width: 100%; padding: 12px; cursor: pointer; border: none; border-radius: 6px; font-weight: 600; transition: 0.2s; font-size: 13px; }
    .copy-btn { background: #0e639c; color: white; }
    .copy-btn:active { background: #1177bb; transform: scale(0.98); }
    .wipe-btn { background: #2a2a2a; color: #ff5f5f; }
    .wipe-btn:hover { background: #333; }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-weight: bold; letter-spacing: 1px; color: #fff;">SYNC-NET</span>
    <span id="status">● Connected</span>
  </div>
  <textarea id="note" placeholder="Right-click text to send it here, or paste directly..."></textarea>
  <div class="btn-container">
    <button id="copyBtn" class="btn copy-btn">COPY LATEST</button>
    <button id="wipeBtn" class="btn wipe-btn">WIPE ALL</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
